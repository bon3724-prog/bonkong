name: 놓치면 손해 정보 발행

# PC(deals_draft.py)가 전날 밤 초안 JSON과 릴스 영상(docs/reels)을 올려 두면,
# 아침 첫 실행에 승인 없이 자동으로 인스타에 올린다(2026-10-28 사용자 요청). 텔레그램 '취소 MMDD'면 안 올린다.
# 첫 실행이 실패해도 다시 시도하도록 오전에 4번 돈다 (06:40 / 08:40 / 10:40 / 12:40 KST, 이미 올렸으면 건너뜀).
# GitHub 예약 실행은 실제로 1~2시간 늦게 시작될 수 있다.
# (예전 운세 발행은 generate.py·cards.py·publish.py에 남아 있지만 더 이상 실행하지 않는다)

on:
  schedule:
    - cron: "40 21 * * *"
    - cron: "40 23 * * *"
    - cron: "40 1 * * *"
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-deals
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: pip install "requests>=2.31,<3"
      - name: 인스타 자동 발행 (취소 확인)
        env:
          PAGES_BASE: ${{ vars.PAGES_BASE }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python deals_publish.py
      - name: 상태 기록 (posted / cancelled)
        if: always()
        run: |
          git config user.name "deals-bot"
          git config user.email "actions@github.com"
          git add data/deals
          git commit -m "놓치면 손해 상태 $(TZ=Asia/Seoul date +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
